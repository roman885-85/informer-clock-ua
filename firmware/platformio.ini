; Точна копія прошивки автора Clock Informer 2.7.1 (ESP32) — перенесено з декомпіляції функція за функцією.
; Ядро й бібліотеки — ті самі, що в оригіналі: Arduino-ESP32 1.0.4 (пакет 3.10004.210126, ESP-IDF 3.3).
; Табло — як у автора: lib/MD_Parola = MD_Parola 3.5.2 + 10 ефектів автора, lib/MD_MAX72XX = 3.2.3 без змін
; (версії підібрано звіркою машинного коду під час реконструкції).
; Таблиця розділів — як у годиннику (nvs, otadata, app0, app1, spiffs 0x3D0000/0x30000).
[env:clock]
platform = espressif32@3.0.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_clock.csv
upload_speed = 230400
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1 -fpermissive -Wno-write-strings
lib_ignore = AsyncTCP
lib_deps =
    esphome/AsyncTCP-esphome @ 1.2.2
    esphome/ESPAsyncWebServer-esphome @ 2.1.0
    marvinroger/AsyncMqttClient @ 0.9.0
    bblanchon/ArduinoJson @ 7.2.1
    fastled/FastLED @ 3.6.0
    dfrobot/DFRobotDFPlayerMini @ 1.0.5
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    beegee-tokyo/DHT sensor library for ESPx @ 1.19
    adafruit/Adafruit Unified Sensor @ 1.1.14
    adafruit/Adafruit BME280 Library @ 2.2.4
    adafruit/Adafruit BMP280 Library @ 2.6.8
    adafruit/Adafruit BMP085 Library @ 1.2.4
    adafruit/Adafruit SGP30 Sensor @ 2.0.3
    sparkfun/SparkFun CCS811 Arduino Library @ 2.0.3
    adafruit/Adafruit AM2320 sensor library @ 1.2.5
    adafruit/RTClib @ 2.1.4
    sparkfun/SparkFun SCD4x Arduino Library @ 1.1.2
    adafruit/Adafruit HDC1000 Library @ 2.0.2
    enjoyneering/AHT10 @ 1.1.0
    paulstoffregen/Time @ 1.6.1
    witnessmenow/YoutubeApi @ 2.0.0

; Діагностика (не копія!): налагоджувальні рядки веб-консолі дублюються в Serial 115200.
[env:diag]
extends = env:clock
build_flags = ${env:clock.build_flags} -DCOPY_DIAG
