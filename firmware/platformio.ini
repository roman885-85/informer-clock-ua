; Informer Clock UA — прошивка для ESP32 (окремий проєкт на основі Clock Informer 2.7.1 автора Semen_p, CC BY-NC 4.0).
; Ядро й бібліотеки — ті самі, що в оригіналі: Arduino-ESP32 1.0.4 (пакет 3.10004.210126, ESP-IDF 3.3), версії
; закріплено нижче. Табло — як у автора: lib/MD_Parola = MD_Parola 3.5.2 + 10 ефектів автора, lib/MD_MAX72XX = 3.2.3
; (+ замок шини SPI для плавної яскравості). Веб-сервер — lib/ESPAsyncWebServer-esphome = 2.1.0 + гачок потоку AsyncTCP
; (черга повідомлень веб-інтерфейсу), lib/AsyncTCP-esphome = 1.2.2 + перевірка FIN під час закриття (FORK.md у теках).
; Таблиця розділів — як у прошивці автора (nvs, otadata, app0, app1, spiffs 0x3D0000/0x30000): налаштування користувача
; зберігаються при переході з прошивки автора.
; EN: Informer Clock UA firmware for ESP32 (independent project based on Clock Informer 2.7.1 by Semen_p, CC BY-NC 4.0).
; Same core and libraries as the original (Arduino-ESP32 1.0.4, pinned below); same partition table, so user settings
; survive switching from the original firmware. Build: pio run -e clock ; flash: pio run -e clock -t upload
[env:clock]
platform = espressif32@3.0.0
platform_packages =
    framework-arduinoespressif32 @ 3.10004.210126
    toolchain-xtensa32 @ 2.50200.97
    tool-esptoolpy @ 1.30000.201119
board = esp32dev
framework = arduino
board_build.partitions = partitions_clock.csv
upload_speed = 230400
monitor_speed = 115200
; -Wl,--wrap=… — виправлення ядра 1.0.4 (src/netfix.cpp): DNS (hostByName) і блокуюче з'єднання без
; тайм-ауту (lwip_connect, ним користується HTTPS-клієнт погоди й новин), лічильник встановлень часу SNTP (settimeofday),
; запис причини аварії (xt_unhandled_exception, panicHandler — src/crash.cpp), журнал ядра в сетевий журнал (log_printf)
build_flags = -DCORE_DEBUG_LEVEL=1 -fpermissive -Wno-write-strings
    -Wl,--wrap=_ZN16WiFiGenericClass10hostByNameEPKcR9IPAddress
    -Wl,--wrap=lwip_connect
    -Wl,--wrap=settimeofday
    -Wl,--wrap=xt_unhandled_exception -Wl,--wrap=panicHandler -Wl,--wrap=log_printf
lib_ignore = AsyncTCP
lib_deps =
    marvinroger/AsyncMqttClient @ 0.9.0
    bblanchon/ArduinoJson @ 7.2.1
    fastled/FastLED @ 3.6.0
    dfrobot/DFRobotDFPlayerMini @ 1.0.5
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    beegee-tokyo/DHT sensor library for ESPx @ 1.19
    adafruit/Adafruit Unified Sensor @ 1.1.14
    adafruit/Adafruit BME280 Library @ 2.2.4
    adafruit/Adafruit BMP280 Library @ 2.6.8
    adafruit/Adafruit BMP085 Library @ 1.2.4
    adafruit/Adafruit SGP30 Sensor @ 2.0.3
    sparkfun/SparkFun CCS811 Arduino Library @ 2.0.3
    adafruit/Adafruit AM2320 sensor library @ 1.2.5
    adafruit/RTClib @ 2.1.4
    sparkfun/SparkFun SCD4x Arduino Library @ 1.1.2
    adafruit/Adafruit HDC1000 Library @ 2.0.2
    enjoyneering/AHT10 @ 1.1.0
    paulstoffregen/Time @ 1.6.1
    witnessmenow/YoutubeApi @ 2.0.0

; Діагностика: налагоджувальні рядки веб-консолі дублюються в Serial 115200 (EN: debug lines also to Serial).
[env:diag]
extends = env:clock
build_flags = ${env:clock.build_flags} -DCOPY_DIAG
