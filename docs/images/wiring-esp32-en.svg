<text x="49.0" y="716" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">MAX7219 display (FC16): 4–16 modules 8×8</text>
<text x="49.0" y="740" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">VCC → 5 V   GND → GND</text>
<text x="49.0" y="759" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">DIN → GPIO23   CLK → GPIO18   CS → GPIO5</text>
<text x="49.0" y="778" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">2 floors of 4 or 8: DIN of 2nd ← DOUT of 1st; CLK, CS, 5 V in parallel</text>
<rect x="515.0" y="690" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="515.0" y="690" width="8" height="108" rx="4" fill="#d62828"/>
<text x="537.0" y="716" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">Power 5 V, 2 A</text>
<text x="537.0" y="740" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">5 V → board VIN, display, strip, DFPlayer</text>
<text x="537.0" y="759" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">1000 µF 6.3 V across 5 V and GND at the input</text>
<text x="537.0" y="778" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">all GND common; sensors from the board 3.3 V</text>
<rect x="1003.0" y="690" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="1003.0" y="690" width="8" height="108" rx="4" fill="#2a9d8f"/>
<text x="1025.0" y="716" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">Photoresistor 5528 (brightness)</text>
<text x="1025.0" y="740" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">3.3 V → photoresistor → GPIO34</text>
<text x="1025.0" y="759" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">GPIO34 → 10 kΩ → GND</text>
<rect x="27.0" y="814" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="27.0" y="814" width="8" height="108" rx="4" fill="#3a86ff"/>
<text x="49.0" y="840" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">WS2812B strip (up to 30 LEDs)</text>
<text x="49.0" y="864" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">DIN ← 220 Ω ← GPIO27; +5 V, GND</text>
<text x="49.0" y="883" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">the count is set on the “LED Light” page</text>
<rect x="515.0" y="814" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="515.0" y="814" width="8" height="108" rx="4" fill="#1d70b8"/>
<text x="537.0" y="840" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">I²C sensors (optional)</text>
<text x="537.0" y="864" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">SDA → GPIO21   SCL → GPIO22   VCC → 3.3 V</text>
<text x="537.0" y="883" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">RTC DS3231/DS1307, BME280/BMP280/BMP180,</text>
<text x="537.0" y="902" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">AHT10, HDC1080, AM2320, SGP30, CCS811, SCD40/41</text>
<rect x="1003.0" y="814" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="1003.0" y="814" width="8" height="108" rx="4" fill="#2a9d8f"/>
<text x="1025.0" y="840" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">DS18B20 · DHT11/DHT22 (optional)</text>
<text x="1025.0" y="864" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">DS18B20: data → GPIO26, 4.7–10 kΩ to 3.3 V</text>
<text x="1025.0" y="883" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">DHT: data → GPIO14, 10 kΩ to 3.3 V</text>
<rect x="27.0" y="938" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="27.0" y="938" width="8" height="108" rx="4" fill="#e09f3e"/>
<text x="49.0" y="964" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">DFPlayer Mini + speaker (voice, alarm)</text>
<text x="49.0" y="988" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">VCC → 5 V; RX ← 1 kΩ ← GPIO17; TX → GPIO16</text>
<text x="49.0" y="1007" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">SPK1/SPK2 → 3 W speaker; files on microSD</text>
<rect x="515.0" y="938" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="515.0" y="938" width="8" height="108" rx="4" fill="#c77d00"/>
<text x="537.0" y="964" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">MH-Z19B, CO₂ (optional)</text>
<text x="537.0" y="988" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">VIN → 5 V; TX → GPIO15; RX ← GPIO4</text>
<text x="537.0" y="1007" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">not together with DFPlayer (shared UART1)</text>
<rect x="1003.0" y="938" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="1003.0" y="938" width="8" height="108" rx="4" fill="#b5838d"/>
<text x="1025.0" y="964" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">Buzzer and LED (optional)</text>
<text x="1025.0" y="988" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">GPIO2 → 220 Ω → C945 base (NPN), emitter → GND</text>
<text x="1025.0" y="1007" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">buzzer and LED (with 220 Ω) — between 5 V and collector</text>
<rect x="515.0" y="1062" width="470" height="108" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="515.0" y="1062" width="8" height="108" rx="4" fill="#888888"/>
<text x="537.0" y="1088" font-size="15" text-anchor="start" font-weight="bold" fill="var(--fg)">Button</text>
<text x="537.0" y="1112" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">GPIO0 is the BOOT button on the board</text>
<text x="537.0" y="1131" font-size="13" text-anchor="start" font-weight="normal" fill="var(--muted)">external one in parallel to BOOT: GPIO0 ↔ GND</text>
<text x="750.0" y="1204" font-size="12.5" text-anchor="middle" font-weight="normal" fill="var(--muted)">Pins come from the firmware source (firmware/src). Physical layout — see the original schematic by the author: docs/images/original-esp32-schematic.png</text>
